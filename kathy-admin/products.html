<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products – Kathy Designs Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

<!-- Mobile Top Bar -->
<div class="mobile-topbar">
  <button class="mobile-menu-btn" id="mobileMenuBtn">
    <i class="fas fa-bars"></i>
  </button>
  <div class="mobile-logo">
    <i class="fas fa-crown"></i>
    <span>Kathy Admin</span>
  </div>
  <div class="mobile-avatar">
    <i class="fas fa-user-circle"></i>
  </div>
</div>

<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<aside class="admin-sidebar" id="adminSidebar">
  <div class="admin-logo">
    <i class="fas fa-crown"></i>
    <span>Kathy Admin</span>
  </div>
  <nav>
    <ul>
      <li><a href="dashboard.html"><i class="fas fa-chart-line"></i><span>Dashboard</span></a></li>
      <li class="active"><a href="products.html"><i class="fas fa-tshirt"></i><span>Products</span></a></li>
      <li><a href="orders.html"><i class="fas fa-shopping-bag"></i><span>Orders</span></a></li>
      <li><a href="customers.html"><i class="fas fa-users"></i><span>Customers</span></a></li>
      <li><a href="messages.html"><i class="fas fa-envelope"></i><span>Messages</span></a></li>
      <li><a href="settings.html"><i class="fas fa-cog"></i><span>Settings</span></a></li>
    </ul>
  </nav>
  <div class="sidebar-footer">
    <a href="../index.html"><i class="fas fa-store"></i><span>View Store</span></a>
  </div>
</aside>

<!-- Main Content -->
<main class="admin-main">

  <!-- Top Bar -->
  <div class="admin-topbar">
    <div class="admin-topbar-left">
      <h1>Products</h1>
      <p class="admin-date">Manage your product inventory</p>
    </div>
    <div class="admin-topbar-right">
      <div class="admin-avatar">
        <i class="fas fa-user-circle"></i>
        <span>Admin</span>
      </div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="admin-section" style="margin-bottom:16px;">
    <div class="products-toolbar">
      <div class="products-toolbar-left">
        <div class="search-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search products…">
        </div>
        <select id="categoryFilter">
          <option value="all">All Categories</option>
          <option value="Women">Women</option>
          <option value="Men">Men</option>
          <option value="Bags & Shoes">Bags & Shoes</option>
          <option value="Fabrics">Fabrics</option>
          <option value="Accessories">Accessories</option>
        </select>
        <span style="font-size:0.85rem;color:#888;">
          <strong id="totalProducts">0</strong> products
        </span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="admin-add-btn" id="exportBtn">
          <i class="fas fa-download"></i> Export CSV
        </button>
        <button class="admin-add-btn" id="addProductBtn">
          <i class="fas fa-plus"></i> Add Product
        </button>
      </div>
    </div>
  </div>

  <!-- Product Grid -->
  <div class="admin-section">
    <div class="products-grid" id="productGrid">
      <div style="grid-column:1/-1;text-align:center;padding:3rem;color:#aaa;">
        <i class="fas fa-spinner fa-spin" style="font-size:2rem;margin-bottom:1rem;display:block;"></i>
        <p>Loading products...</p>
      </div>
    </div>
  </div>

</main>

<!-- Add/Edit Product Modal -->
<div class="admin-modal-overlay" id="productModal">
  <div class="admin-modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
      <h2 id="modalTitle">Add New Product</h2>
      <button class="order-modal-close" id="closeModalBtn">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <form id="productForm">
      <div class="form-group">
        <label>Product Name *</label>
        <input type="text" id="productName" placeholder="e.g. Ankara Wrap Dress" required>
      </div>
      <div class="form-group">
        <label>Price (GHC) *</label>
        <input type="number" id="productPrice" placeholder="e.g. 250" min="0" step="0.01" required>
      </div>
      <div class="form-group">
        <label>Category *</label>
        <select id="productCategory" required>
          <option value="">Select category…</option>
          <option value="Women">Women</option>
          <option value="Men">Men</option>
          <option value="Bags & Shoes">Bags & Shoes</option>
          <option value="Fabrics">Fabrics</option>
          <option value="Accessories">Accessories</option>
        </select>
      </div>
      <div class="form-group">
        <label>Image Path</label>
        <input type="text" id="productImage" placeholder="e.g. productImages/dress.webp">
      </div>
      <div class="form-group">
        <label>Stock Quantity</label>
        <input type="number" id="productStock" placeholder="e.g. 10" min="0">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="productDescription" rows="3" placeholder="Brief product description…"></textarea>
      </div>
      <div class="admin-modal-buttons">
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit"><i class="fas fa-save"></i> Save Product</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="delete-modal" id="deleteModal">
  <div class="delete-modal-box">
    <i class="fas fa-trash" style="font-size:2.5rem;color:#e53935;margin-bottom:1rem;display:block;"></i>
    <h3>Delete Product?</h3>
    <p>This action cannot be undone. The product will be permanently removed.</p>
    <div class="delete-modal-actions">
      <button id="cancelDeleteBtn" style="background:#f0f0f0;color:#555;">Cancel</button>
      <button id="confirmDeleteBtn" style="background:#e53935;color:white;">Delete</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="products.js"></script>
</body>
</html>
